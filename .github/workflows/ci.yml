name: ci

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          pip install -e packages/common -e packages/config -e packages/database \
            -e packages/messaging -e packages/auth -e packages/logging -e packages/metrics \
            -e apps/api -e apps/worker -e apps/scheduler \
            -r requirements-dev.txt fastapi httpx cryptography redis
      - name: Lint
        run: ruff check packages apps tests
      - name: Unit tests
        run: pytest tests/unit -v --cov=packages --cov=apps --cov-report=term-missing

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventmesh
          POSTGRES_PASSWORD: eventmesh
          POSTGRES_DB: eventmesh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eventmesh"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          pip install -e packages/common -e packages/config -e packages/database \
            -e packages/messaging -e packages/auth -e packages/logging -e packages/metrics \
            -e apps/api -e apps/worker -e apps/scheduler \
            -r requirements-dev.txt fastapi httpx cryptography redis
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://eventmesh:eventmesh@localhost:5432/eventmesh
        run: alembic -c alembic.ini upgrade head
      - name: Integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://eventmesh:eventmesh@localhost:5432/eventmesh
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/integration -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build

# Deliberately NOT included yet, listed as roadmap in README:
#   - security scan step (bandit / pip-audit / Trivy)
#   - k6 load test job
#   - deployment step
# Rule 1 (never fake benchmark numbers) applies to CI too: a load-test
# job that doesn't actually run against a realistic environment would
# produce numbers not worth trusting, so it isn't wired up as "passing"
# until it's backed by a real target environment.
