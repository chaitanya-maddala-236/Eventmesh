version: "3.9"

x-common-env: &common-env
  DATABASE_URL: postgresql+asyncpg://eventmesh:eventmesh@postgres:5432/eventmesh
  REDIS_URL: redis://redis:6379/0
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-local-dev-only-change-me-32bytes!!}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENVIRONMENT: development

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventmesh
      POSTGRES_PASSWORD: eventmesh
      POSTGRES_DB: eventmesh
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventmesh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *common-env
    entrypoint: ["alembic", "-c", "/srv/alembic.ini", "upgrade", "head"]
    volumes:
      - ./alembic.ini:/srv/alembic.ini:ro
      - ./migrations:/srv/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *common-env
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *common-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2

  scheduler:
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
    environment: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  demo-webhook:
    build:
      context: .
      dockerfile: apps/demo-webhook/Dockerfile
    ports: ["9000:9000"]

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.55.0
    ports: ["9090:9090"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # NOTE: the React dashboard (apps/dashboard) is scaffolded in the repo
  # tree but its implementation is NOT included in this pass — see
  # README "Known Limitations". There is deliberately no `dashboard`
  # service here yet; add one (Vite dev server or built static bundle
  # served by nginx) once it exists.

volumes:
  pgdata:
