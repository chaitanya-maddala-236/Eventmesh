global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "eventmesh-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  # Workers/scheduler currently expose metrics only via the shared
  # prometheus_client process registry, which needs an HTTP endpoint per
  # process to be scraped (PRD §51). Wiring `prometheus_client.start_http_server`
  # into the worker/scheduler entrypoints and adding their targets here
  # is listed as a Phase-11 follow-up in README "Known Limitations" —
  # not done in this pass to avoid shipping metrics that were never
  # actually verified to be scraped.
